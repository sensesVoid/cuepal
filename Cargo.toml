[package]
name = "cuepal"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.37"
cpal = "0.18"
rubato = "5"
tray-icon = "0.26"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
libloading = "0.9"
arc-swap = "1"
winreg = "0.56"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
