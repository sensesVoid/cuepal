# Release pipeline — builds a portable zip for CuePal:
# cuepal.exe + libvosk.dll (+ 3 MinGW runtime DLLs). The Vosk speech model is
# embedded in the binary (extracted to a per-user cache on first voice-mode run).
#
# Trigger: push a tag like v0.1.0.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package portable zip (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Fetch libvosk.dll and model (pinned, model embedded at build time)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://github.com/alphacep/vosk-api/releases/download/v0.3.45/vosk-win64-0.3.45.zip" -OutFile vosk-api.zip
          Expand-Archive -Path vosk-api.zip -DestinationPath vosk-api
          Invoke-WebRequest -Uri "https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip" -OutFile model.zip
          Expand-Archive -Path model.zip -DestinationPath model-staging
          $src = Get-ChildItem model-staging -Directory | Select-Object -First 1
          Move-Item $src.FullName model

      - name: Build release binary
        run: cargo build --release

      - name: Stage portable zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/cuepal.exe dist/
          # libvosk.dll plus its three MinGW runtime DLLs — all required at runtime.
          # Speech model is embedded in cuepal.exe (extracted on first voice-mode run).
          Copy-Item "vosk-api/vosk-win64-0.3.45/*.dll" dist/
          if (-not (Test-Path "dist/libvosk.dll")) { throw "libvosk.dll not found in vosk-win64-0.3.45.zip" }
          Compress-Archive -Path "dist/*" -DestinationPath "CuePal-${{ github.ref_name }}-win64.zip"

      - name: Attach to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "CuePal-${{ github.ref_name }}-win64.zip" --title "CuePal ${{ github.ref_name }}" --generate-notes
