# CI for CuePal — a Windows-only Rust app (see docs/CuePal PRD v2.md).
# Runs on every push to main and on every pull request.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: fmt, clippy, test (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # The Vosk speech model is embedded into the binary at compile time, so it
      # must be present in ./model before build/test. libvosk.dll (+ MinGW runtime
      # DLLs) are loaded at runtime and must be next to the test binary.
      - name: Fetch Vosk runtime DLLs and embedded model (pinned)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://github.com/alphacep/vosk-api/releases/download/v0.3.45/vosk-win64-0.3.45.zip" -OutFile vosk-api.zip
          Expand-Archive -Path vosk-api.zip -DestinationPath vosk-api
          Copy-Item "vosk-api/vosk-win64-0.3.45/*.dll" .
          if (-not (Test-Path "libvosk.dll")) { throw "libvosk.dll not found in vosk-win64-0.3.45.zip" }
          Invoke-WebRequest -Uri "https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip" -OutFile model.zip
          Expand-Archive -Path model.zip -DestinationPath model-staging
          $src = Get-ChildItem model-staging -Directory | Select-Object -First 1
          Move-Item $src.FullName model
          Add-Content $env:GITHUB_PATH $PWD.Path

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint (clippy)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test
