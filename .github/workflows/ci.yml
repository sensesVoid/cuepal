# CI for CuePal — a Windows-only Rust app (see docs/CuePal PRD v2.md).
#
# Runs on every push to main and on every pull request.
# While the repo has no Cargo.toml yet (code lands with milestone M0),
# the job skips itself so the branch stays green.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: fmt, clippy, test (windows-latest)
    runs-on: windows-latest
    if: ${{ hashFiles('Cargo.toml') != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # The vosk crate needs libvosk.dll available (linking and/or runtime).
      # Fetch the pinned prebuilt binary so recognizer code and tests work
      # as soon as the M0 scaffold lands. If the crate chosen in M0 needs an
      # import library or a different layout, adjust this step then.
      - name: Fetch libvosk.dll (pinned vosk-api v0.3.45)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://github.com/alphacep/vosk-api/releases/download/v0.3.45/vosk-win64-0.3.45.zip" -OutFile vosk-api.zip
          Expand-Archive -Path vosk-api.zip -DestinationPath vosk-api
          $dll = Get-ChildItem -Path vosk-api -Recurse -Filter libvosk.dll | Select-Object -First 1
          if (-not $dll) { throw "libvosk.dll not found in vosk-win64-0.3.45.zip" }
          Copy-Item $dll.FullName .
          Add-Content $env:GITHUB_PATH $PWD.Path

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint (clippy)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test
